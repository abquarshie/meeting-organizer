name: Check

# Runs on every pull request and push so a broken change never reaches Vercel: the message files (both languages),
# the Next.js type check and build, and the Python tests (the scheduling rules and every document) against a
# throwaway Postgres. The tests that need the published forms skip here, since the forms are not in the repository.
on:
  pull_request:
  push:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # no DATABASE_URL: the build then skips creating tables and never connects to a database
      SESSION_SECRET: ci-only-not-a-real-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:messages
      - run: npm run typecheck
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: meetings
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # each test makes and uses its own schema in this throwaway database (conftest.py), never Neon
      MEETING_DSN: postgresql://ci:ci@localhost:5432/meetings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt pytest
      - run: python -m pytest tests -q
